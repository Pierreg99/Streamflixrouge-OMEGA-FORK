name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to use (e.g. v1.7.230). Defaults to manual-N"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=manual-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager "platforms;android-36" "ndk;26.1.10909125" >/dev/null || true

      - name: Access Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          echo TMDB_API_KEY=$TMDB_API_KEY >> local.properties
          echo RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API >> local.properties

      - name: Generate native-lib.cpp from template
        env:
          UPROT_MSFI_API_BASE: ${{ secrets.UPROT_MSFI_API_BASE }}
          UPROT_MSE_API_BASE: ${{ secrets.UPROT_MSE_API_BASE }}
          UPROT_API_KEY: ${{ secrets.UPROT_API_KEY }}
        run: |
          sed -e "s|{{UPROT_MSFI_API_BASE}}|$UPROT_MSFI_API_BASE|g" \
              -e "s|{{UPROT_MSE_API_BASE}}|$UPROT_MSE_API_BASE|g" \
              -e "s|{{UPROT_API_KEY}}|$UPROT_API_KEY|g" \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Prepare signing keystore
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/streamflix.keystore"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PASS=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KEYSTORE_FILE" \
              -storepass streamflix-ci -alias streamflix -keypass streamflix-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Streamflix CI, O=Streamflix, C=IN"
            echo "KEYSTORE_PASS=streamflix-ci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=streamflix" >> "$GITHUB_ENV"
            echo "KEY_PASS=streamflix-ci" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build default APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign default APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$RUNNER_TEMP/streamflix-$TAG_NAME.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Build mobile APK
        run: |
          echo APP_LAYOUT=mobile >> local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Sign mobile APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned-mobile.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$RUNNER_TEMP/streamflix-$TAG_NAME-only-mobile.apk" "$RUNNER_TEMP/aligned-mobile.apk"

      - name: Build TV APK
        run: |
          echo APP_LAYOUT=tv >> local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Sign TV APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned-tv.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$RUNNER_TEMP/streamflix-$TAG_NAME-only-tv.apk" "$RUNNER_TEMP/aligned-tv.apk"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            "$RUNNER_TEMP/streamflix-$TAG_NAME.apk"
            "$RUNNER_TEMP/streamflix-$TAG_NAME-only-mobile.apk"
            "$RUNNER_TEMP/streamflix-$TAG_NAME-only-tv.apk"
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "Streamflix $TAG_NAME" \
              --notes "Automatic build for $TAG_NAME (commit $GITHUB_SHA)"
          fi
